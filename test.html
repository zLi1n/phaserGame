function component(width, height, color, x, y, type) {

let initialAlpha, initialBeta, initialGamma;
let initialized = false;

function handleOrientation(event) {
    const alpha = event.alpha;
    const beta = event.beta;
    const gamma = event.gamma;

    // Display the current orientation values
    document.getElementById('alpha').textContent = alpha !== null ? alpha.toFixed(2) : 'N/A';
    document.getElementById('beta').textContent = beta !== null ? beta.toFixed(2) : 'N/A';
    document.getElementById('gamma').textContent = gamma !== null ? gamma.toFixed(2) : 'N/A';

    const movingImage = document.getElementById('movingImage');
    
    const sensitivity = 3;
    const border = 50;
    
    // Initialize the initial orientation values
    if (!initialized) {
        initialAlpha = alpha;
        initialBeta = beta;
        initialGamma = gamma;
        initialized = true;
    }
    
    // Calculate the new positions based on the difference from the initial values
    let leftPosition = window.innerWidth / 2 + (gamma - initialGamma) * sensitivity;
    let topPosition = window.innerHeight / 2 + (beta - initialBeta) * sensitivity * 2;

    // Ensure the image doesn't move outside the border limits
    leftPosition = Math.max(border, Math.min(window.innerWidth - movingImage.width - border, leftPosition));
    topPosition = Math.max(border, Math.min(window.innerHeight - movingImage.height - border, topPosition));

    // Set the new positions
    movingImage.style.left = leftPosition + 'px';
    movingImage.style.top = topPosition + 'px';
}
