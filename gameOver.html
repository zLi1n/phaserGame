<head>

    <div class="downloadCtn">
    <a href="" class="downloadButton">
      <img src="\assets\googleplay_logo_icon.svg" alt="Google Play Logo" class="icon">

  </a>
  <a href="" class="downloadButton">
      <img src="\assets\apple_icon.svg" alt="Apple Store Logo" class="icon">

  </a>
</div>
    </div>

  </div>
