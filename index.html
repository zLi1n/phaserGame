<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="/favicon_io/favicon.ico" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Test</title>
  </head>
  <body>
    <main>
      <div id="gameStartDiv" class="home">
        <img draggable="false" src="\assets\Catch-Win.gif" class="title">
        <button id="gameStartBtn"><p>PLAY NOW</p></button>
        </form>
      </div>

      <div id="infoInputDiv" class="popup">
        <form id="userForm" action="display.html" method="POST">
          <input type="text" id="nameInput" name="name" class="inputField" placeholder="Name" required>
          <span class="errMsgName">
            <span class="errorMsg"><span class="material-symbols-outlined">error</span>Name only allows letters</span>
          </span>
          <input type="tel" id="telInput" name="telNo" class="inputField" placeholder="Phone Number" required>
          <span class="errMsgTel">
            <span class="errorMsg"><span class="material-symbols-outlined">error</span>Phone number only allows numbers</span>
          </span>
          <div id="test"></div>
          <button id="infoInputBtn" type="submit" disabled><p>Confirm</p></button>
        </form>
      </div>

    </main>
    <script type="module" src="/nav.js"></script>
  </body>
</html>
